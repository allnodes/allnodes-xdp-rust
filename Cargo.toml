[package]
name = "allnodes-xdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
# The library is Apache-2.0. The prebuilt dispatcher object it embeds is GPL-2.0, with
# its source in ebpf/ (see NOTICE).
license = "Apache-2.0 AND GPL-2.0-only"
description = "AF_XDP for Linux services: a shared XDP hook, UDP send and receive engines, a QUIC socket"
publish = false
include = [
    "Cargo.toml",
    "src/**",
    "ebpf/Cargo.toml",
    "ebpf/Cargo.lock",
    "ebpf/src/**",
    "objects/**",
    "scripts/**",
    "LICENSE",
    "LICENSE-GPL-2.0",
    "NOTICE",
    "README.md",
]

[features]
testing = []

[dependencies]
arc-swap = "1"
bytes = "1"
crossbeam-channel = "0.5"
libc = "0.2"
parking_lot = "0.12"
quinn = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "time", "sync"] }
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(target_os = "linux")'.dependencies]
arrayvec = "0.7"
aya = "0.14"
caps = "0.5.6"
crossbeam-queue = "0.3"

[lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"
